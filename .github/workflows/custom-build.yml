name: Custom Build

on:
  workflow_dispatch:
    inputs:
      app_name:
        description: App name
        required: false
        default: "Quicksend"
        type: string
      app_version:
        description: App version
        required: false
        default: "1.0.0"
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Locate Android project
        run: |
          MANIFEST="$(find . -type f -path '*/app/src/main/AndroidManifest.xml' -not -path '*/build/*' | head -n 1)"
          if [ -z "$MANIFEST" ]; then
            echo "No Android project found in the repo"
            exit 1
          fi
          PROJECT_DIR="$(dirname "$(dirname "$(dirname "$(dirname "$MANIFEST")")")")"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Android project found at $PROJECT_DIR"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Patch app name and version
        env:
          APP_NAME: ${{ inputs.app_name }}
          APP_VERSION: ${{ inputs.app_version }}
        run: |
          export VERSION_CODE="$(date +%s)"
          python3 - <<'PY'
          import os, re

          project = os.environ["PROJECT_DIR"]
          name = re.sub(r"[\r\n]+", " ", os.environ.get("APP_NAME", "")).strip() or "Quicksend"
          version = re.sub(r"[\r\n]+", " ", os.environ.get("APP_VERSION", "")).strip() or "1.0.0"
          code = os.environ["VERSION_CODE"]

          xml_name = name.replace("&", "&amp;").replace("<", "&lt;").replace(">", "&gt;").replace('"', "&quot;")
          kt_version = version.replace("\\", "\\\\").replace('"', '\\"').replace("$", "\\$")

          manifest = os.path.join(project, "app", "src", "main", "AndroidManifest.xml")
          with open(manifest, "r", encoding="utf-8") as f:
              text = f.read()
          text, n = re.subn(r'android:label="[^"]*"', lambda m: 'android:label="' + xml_name + '"', text, count=1)
          if n == 0:
              text = re.sub(r"<application", lambda m: '<application android:label="' + xml_name + '"', text, count=1)
          with open(manifest, "w", encoding="utf-8") as f:
              f.write(text)

          gradle = os.path.join(project, "app", "build.gradle.kts")
          with open(gradle, "r", encoding="utf-8") as f:
              g = f.read()
          g = re.sub(r"versionCode\s*=\s*\d+", lambda m: "versionCode = " + code, g)
          g = re.sub(r'versionName\s*=\s*"[^"]*"', lambda m: 'versionName = "' + kt_version + '"', g)
          with open(gradle, "w", encoding="utf-8") as f:
              f.write(g)

          print("App name:", name)
          print("Version:", version, "code:", code)
          PY

      - name: Apply custom icon
        if: ${{ hashFiles('build-icon.png') != '' }}
        run: |
          for d in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            mkdir -p "$PROJECT_DIR/app/src/main/res/mipmap-$d"
            cp build-icon.png "$PROJECT_DIR/app/src/main/res/mipmap-$d/ic_launcher.png"
            cp build-icon.png "$PROJECT_DIR/app/src/main/res/mipmap-$d/ic_launcher_round.png"
          done
          python3 - <<'PY'
          import os, re

          project = os.environ["PROJECT_DIR"]
          manifest = os.path.join(project, "app", "src", "main", "AndroidManifest.xml")
          with open(manifest, "r", encoding="utf-8") as f:
              text = f.read()

          attrs = 'android:icon="@mipmap/ic_launcher" android:roundIcon="@mipmap/ic_launcher_round"'
          m = re.search(r"<application\b[^>]*>", text, re.S)
          if m:
              tag = m.group(0)
              tag = re.sub(r'\s+android:(?:icon|roundIcon)="[^"]*"', "", tag)
              tag = re.sub(r"<application", lambda _m: "<application " + attrs, tag, count=1)
              text = text[:m.start()] + tag + text[m.end():]
              with open(manifest, "w", encoding="utf-8") as f:
                  f.write(text)
              print("Custom icon applied")
          else:
              print("No application tag found, icon not applied")
          PY

      - name: No custom icon found
        if: ${{ hashFiles('build-icon.png') == '' }}
        run: echo "build-icon.png not found, continuing with the default icon"

      - name: Build debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Android-APK
          path: "${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk"
          if-no-files-found: error